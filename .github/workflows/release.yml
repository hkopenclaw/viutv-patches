name: Release

# 手動出 release：去 GitHub repo → Actions → Release → Run workflow，
# 輸入版本號（例如 1.0.0），就會 build 個 .mpp bundle 再出一個 GitHub Release。
# morphe-magisk-module 嘅 builder 就係由呢個 Release 度 download 個 .mpp 嚟用。
#
# 註：呢個係簡化版 workflow。官方 MorpheApp/morphe-patches 用 semantic-release
# 自動出 release；呢度唔用嗰套，等初學者容易明、容易改。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  release:
    name: Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build patches bundle
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes "ViuTV Picture-in-Picture patches." \
            patches/build/libs/patches-*.mpp
